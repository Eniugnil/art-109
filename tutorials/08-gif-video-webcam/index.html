<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦀</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/N2e1sEcDYx0?si=T7uyarzZ-vN1-kzJ&mute=1&autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <img class="cat-fishing" src="media/cat-fishing.gif" alt="Cat with a fishing rod using a cookie as bait">
      <div class="image-text-div">
        <!-- <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Fuga, fugit odit! Enim dolore numquam fugiat dolorum fuga quam magni ipsa vero et voluptate sint fugit, quisquam, corrupti est. Unde, culpa?</p> -->
        <img class="rowing-potato" src="media/rowing-potato.gif" alt="Potato in a row boat">
      </div>
      <!-- autoplay video -->
      <video width="360" height="640" autoplay muted loop>
        <source src="media/underwater-rock-throw.mp4" type="video/mp4">
      </video>
      <!-- hover video -->
      <video class="hover-video" width="360" height="640" muted loop>
        <source src="media/underwater-rock-throw.mp4" type="video/mp4">
      </video>
      <!-- click to play video -->
      <video class="click-video" width="360" height="640" muted loop>
        <source src="media/underwater-rock-throw.mp4" type="video/mp4">
      </video>

      <video id="webcam" autoplay playsinline></video>
    </main>
    <script src="js/main.js"></script>
    <script src="js/webcam.js"></script>
  </body>
</html>
